name: Promotion Integrity Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  promotion-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Promotion Integrity Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          PYTHONPATH=backend pytest backend/app/tests/promotion/
