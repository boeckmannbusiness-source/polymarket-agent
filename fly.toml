# fly.toml app configuration file generated for polymarket-agent-9ygsug on 2026-05-26T15:02:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'polymarket-agent-9ygsug'
primary_region = 'fra'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_PORT = '8080'
  CORS_ORIGINS = 'https://polymarket-agent-tau.vercel.app'
  DATABASE_MAX_OVERFLOW = '1'
  DATABASE_POOL_SIZE = '2'
  LLM_DEFAULT_PROVIDER = 'fallback'
  METRICS_ENABLED = 'false'
  REDIS_MAX_CONNECTIONS = '10'
  TRADING_MODE = 'paper'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
