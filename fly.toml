app = "polymarket-agent-9ygsug"
primary_region = "fra"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_PORT = "8080"
  TRADING_MODE = "paper"
  CORS_ORIGINS = "https://polymarket-agent-tau.vercel.app"
  LLM_DEFAULT_PROVIDER = "fallback"
  METRICS_ENABLED = "false"
  DATABASE_POOL_SIZE = "2"
  DATABASE_MAX_OVERFLOW = "1"
  REDIS_MAX_CONNECTIONS = "10"
